name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run sim-check tests
        run: npm run sim-check

      - name: Build project
        run: npm run build
        env:
          # Relay TURN propio para el online entre redes estrictas (src/net/peer.ts). Si los secrets
          # no están cargados quedan vacíos y el build usa el relay público por defecto.
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USER: ${{ secrets.TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.TURN_PASS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
